      security: []
  '/api/learn/courses/{course_slug}':
    get:
      summary: ''
      operationId: getApiLearnCoursesCourse_slug
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: kodakademi
          schema:
            type: string
      responses: {}
      tags:
