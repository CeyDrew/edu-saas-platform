openapi: 3.0.3
info:
  title: 'Edu SaaS API'
  description: 'Çok kiracılı eğitim platformunun REST API’si: katalog, satış, öğrenme, yapay zekâ ve raporlama.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/auth/login:
    post:
      summary: ''
      operationId: postApiAuthLogin
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: kodakademi
          schema:
            type: string
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                device_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: v
              required:
                - email
                - password
      security: []
  /api/auth/token:
    post:
      summary: 'Issue a personal access token for non-browser clients.'
      operationId: issueAPersonalAccessTokenForNonBrowserClients
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: kodakademi
          schema:
            type: string
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                device_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: v
              required:
                - email
                - password
      security: []
  /api/auth/register:
    post:
      summary: ''
      operationId: postApiAuthRegister
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: kodakademi
          schema:
            type: string
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 120 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 190 characters.'
                  example: zbailey@example.net
                phone:
                  type: string
                  description: ''
                  example: null
                  nullable: true
                password:
                  type: string
                  description: ''
                  example: architecto
              required:
                - name
                - email
                - password
      security: []
  /api/auth/me:
    get:
      summary: ''
      operationId: getApiAuthMe
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: kodakademi
          schema:
            type: string
      responses: {}
      tags:
        - Endpoints
      security: []
  /api/auth/logout:
    post:
      summary: ''
      operationId: postApiAuthLogout
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
