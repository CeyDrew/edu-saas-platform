      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: kodakademi
          schema:
            type: string
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                course:
                  type: string
                  description: 'This field is required when <code>plan_id</code> is not present.'
                  example: architecto
                  nullable: true
                plan_id:
                  type: integer
                  description: 'This field is required when <code>course</code> is not present.'
                  example: 16
                  nullable: true
                coupon:
                  type: string
                  description: 'Must not be greater than 40 characters.'
                  example: 'n'
                  nullable: true
                billing:
                  type: object
                  description: ''
                  example: null
                  properties:
                    type:
                      type: string
                      description: ''
                      example: corporate
                      enum:
                        - individual
                        - corporate
                      nullable: true
                    name:
                      type: string
                      description: 'This field is required when <code>billing.type</code> is <code>individual</code>. Must not be greater than 120 characters.'
                      example: g
                      nullable: true
                    tckn:
                      type: string
                      description: 'This field is required when <code>billing.type</code> is <code>individual</code>.'
                      example: null
                      nullable: true
                    company:
                      type: string
                      description: 'This field is required when <code>billing.type</code> is <code>corporate</code>. Must not be greater than 200 characters.'
                      example: z
                      nullable: true
                    vkn:
                      type: string
                      description: 'This field is required when <code>billing.type</code> is <code>corporate</code>.'
                      example: null
                      nullable: true
                    tax_office:
                      type: string
                      description: 'This field is required when <code>billing.type</code> is <code>corporate</code>. Must not be greater than 100 characters.'
                      example: m
                      nullable: true
                    address:
                      type: string
                      description: 'Must not be greater than 300 characters.'
                      example: i
                      nullable: true
                    city:
                      type: string
                      description: 'Must not be greater than 60 characters.'
                      example: 'y'
                      nullable: true
                  nullable: true
      security: []
  /api/checkout:
    post:
      summary: ''
      operationId: postApiCheckout
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: kodakademi
          schema:
            type: string
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                course:
                  type: string
                  description: 'This field is required when <code>plan_id</code> is not present.'
                  example: architecto
                  nullable: true
                plan_id:
                  type: integer
                  description: 'This field is required when <code>course</code> is not present.'
                  example: 16
                  nullable: true
                coupon:
                  type: string
                  description: 'Must not be greater than 40 characters.'
                  example: 'n'
                  nullable: true
                billing:
                  type: object
                  description: ''
                  example: []
                  properties:
                    type:
                      type: string
                      description: ''
                      example: corporate
                      enum:
                        - individual
                        - corporate
                    name:
                      type: string
                      description: 'This field is required when <code>billing.type</code> is <code>individual</code>. Must not be greater than 120 characters.'
                      example: b
                      nullable: true
                    tckn:
                      type: string
                      description: 'This field is required when <code>billing.type</code> is <code>individual</code>.'
                      example: null
                      nullable: true
                    company:
                      type: string
                      description: 'This field is required when <code>billing.type</code> is <code>corporate</code>. Must not be greater than 200 characters.'
                      example: 'n'
                      nullable: true
                    vkn:
                      type: string
                      description: 'This field is required when <code>billing.type</code> is <code>corporate</code>.'
                      example: null
                      nullable: true
                    tax_office:
                      type: string
                      description: 'This field is required when <code>billing.type</code> is <code>corporate</code>. Must not be greater than 100 characters.'
                      example: g
                      nullable: true
                    address:
                      type: string
                      description: 'Must not be greater than 300 characters.'
                      example: z
                    city:
                      type: string
                      description: 'Must not be greater than 60 characters.'
                      example: m
                  required:
                    - type
                    - address
                    - city
              required:
                - billing
      security: []
  /api/payments/fake/complete:
    post:
      summary: "The local payment page: records the outcome and sends the signed notification\nthrough the same webhook path a real provider would use."
      operationId: theLocalPaymentPageRecordsTheOutcomeAndSendsTheSignedNotificationThroughTheSameWebhookPathARealProviderWouldUse
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: kodakademi
          schema:
            type: string
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: ''
                  example: architecto
                success:
                  type: boolean
                  description: ''
                  example: true
              required:
                - token
                - success
      security: []
  /api/me/courses:
    get:
      summary: ''
      operationId: getApiMeCourses
      description: ''
      parameters:
