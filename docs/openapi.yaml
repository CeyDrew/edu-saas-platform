      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: kodakademi
          schema:
            type: string
      responses: {}
      tags:
        - Endpoints
      security: []
  /api/courses:
    get:
      summary: ''
      operationId: getApiCourses
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: kodakademi
          schema:
            type: string
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                  nullable: true
                category:
                  type: string
                  description: 'Must not be greater than 60 characters.'
                  example: 'n'
                  nullable: true
                level:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: gzmiyvdljnikhway
                  nullable: true
                per_page:
                  type: integer
                  description: 'Must be between 1 and 48.'
                  example: 1
                  nullable: true
      security: []
  '/api/courses/{slug}':
    get:
      summary: ''
      operationId: getApiCoursesSlug
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: kodakademi
          schema:
            type: string
      responses: {}
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: slug
        description: 'The slug of the course.'
        example: sifirdan-php-ve-laravel
        required: true
        schema:
          type: string
  /api/categories:
    get:
      summary: 'Categories with at least one published course, for storefront filters.'
      operationId: categoriesWithAtLeastOnePublishedCourseForStorefrontFilters
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: kodakademi
