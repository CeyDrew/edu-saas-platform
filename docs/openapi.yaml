          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  description: 'Must be between 0 and 9.'
                  example:
                    - 1
                  items:
                    type: integer
      security: []
    parameters:
      -
        in: path
        name: lesson_id
        description: 'The ID of the lesson.'
        example: 1
        required: true
        schema:
