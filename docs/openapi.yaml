          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  description: ''
                  example: null
                  nullable: true
                search:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                  nullable: true
      security: []
    post:
      summary: ''
      operationId: postApiBrandMembers
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: kodakademi
          schema:
            type: string
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 120 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 190 characters.'
                  example: zbailey@example.net
                phone:
                  type: string
                  description: ''
                  example: null
                  nullable: true
                password:
                  type: string
                  description: ''
                  example: architecto
                role:
                  type: string
