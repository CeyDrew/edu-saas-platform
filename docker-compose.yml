name: edu-saas

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: edu-saas/php:latest
  volumes:
    - ./api:/var/www/api
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started

x-after-bootstrap: &after-bootstrap
  php:
    condition: service_healthy
  mysql:
    condition: service_healthy
  redis:
    condition: service_started

services:
  php:
    <<: *php
    # Installs dependencies, creates .env, migrates and seeds on the first start.
    entrypoint: ["bootstrap"]
    command: ["php-fpm", "-R"]
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/api/storage/framework/bootstrapped"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 30s

  horizon:
    <<: *php
    command: php artisan horizon
    restart: unless-stopped
    depends_on: *after-bootstrap

  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on: *after-bootstrap

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www/api:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: edu_saas
      MYSQL_USER: edu
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33060:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama

  web:
    image: node:24-alpine
    working_dir: /app
    # WEB_MODE=production serves an optimized build (used by CI); default is next dev.
    command: sh -c 'npm ci --no-audit --no-fund && if [ "$$WEB_MODE" = "production" ]; then npm run build && npx next start -p 3300; else npm run dev -- -p 3300; fi'
    environment:
      API_INTERNAL_URL: http://nginx
      NEXT_PUBLIC_API_URL: http://localhost:8000
      TENANT_BASE_DOMAIN: localhost
      WATCHPACK_POLLING: "true"
      WEB_MODE: ${WEB_MODE:-development}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3300/"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    ports:
      - "3300:3300"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
      - web-next:/app/.next
    depends_on:
      nginx:
        condition: service_started
      php:
        condition: service_healthy

volumes:
  mysql-data:
  meili-data:
  ollama-data:
  web-node-modules:
  web-next:
